<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPS到期监控</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 使用霞鹜文楷屏幕阅读体 -->
    <link rel="stylesheet" href="https://npm.elemecdn.com/lxgw-wenkai-screen-webfont@1.7.0/lxgwwenkaiscreen.css">
    <style>
        body {
            background-color: #b1cbf1;
            font-family: "LXGW WenKai Screen", sans-serif;
            color: #334155;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            padding-top: 40px;
            padding-bottom: 60px;
        }

        /* 页面标题样式 */
        .page-title {
            color: #475569; /* 使用绿色作为主色调 */
            text-align: center;
            margin-bottom: 35px;
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        /* 统计面板样式优化 */
        .stats-container {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 35px;
            box-shadow: 0 4px 20px rgba(46, 125, 50, 0.08);
            border-top: 4px solid #b1cbf1;
        }

        .stats-item {
            text-align: center;
            padding: 15px 10px;
            position: relative;
        }

        .stats-item:not(:last-child):after {
            content: '';
            position: absolute;
            right: 0;
            top: 25%;
            height: 50%;
            width: 1px;
            background-color: rgba(76, 175, 80, 0.2);
        }

        .stats-item h3 {
            color: #66806a;
            font-size: 0.95rem;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .stats-item p {
            color: #475569;
            font-size: 1.7rem;
            font-weight: 600;
            margin: 0;
        }

        /* 整个VPS列表的容器 */
        .vps-list-container {
            background: rgba(215, 235, 240, 0.8);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(46, 125, 50, 0.08);
            border-top: 4px solid #b1cbf1;
        }

        /* 列表头部 */
        .vps-list-header {
            display: flex;
            border-bottom: 1px solid #e0f2e1;
            padding-bottom: 15px;
            margin-bottom: 15px;
            color: #66806a;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .vps-header-name {
            flex: 1.5;
            padding-left: 10px;
        }

        .vps-header-info {
            flex: 4;
            display: flex;
        }

        .vps-header-item {
            flex: 1;
            text-align: center;
            padding: 0 12px;
        }

        .vps-header-action {
            width: 180px;
            text-align: center;
        }

        .vps-header-status {
            width: 90px;
            text-align: center;
        }

        /* VPS行样式 - 去除边框和分隔感 */
        .vps-row {
            display: flex;
            align-items: center;
            padding: 15px 10px;
            border-bottom: 1px solid rgba(224, 242, 225, 0.5);
            transition: all 0.2s ease;
        }

        .vps-row:hover {
            background-color: rgba(224, 242, 225, 0.3);
        }

        .vps-row:last-child {
            border-bottom: none;
        }

        .vps-name {
            flex: 1.5;
            padding-right: 12px;
        }

        .vps-name a {
            color: #2f343c;
            font-weight: 500;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .vps-name a:hover {
            color: #4caf50;
        }

        .vps-note {
            font-size: 0.75rem;
            color: #66806a;
            margin-top: 4px;
            line-height: 1.4;
            word-break: break-all;
        }

        .vps-info {
            flex: 4;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .vps-info-item {
            padding: 0 12px;
            flex: 1;
            text-align: center;
        }

        .vps-info-label {
            color: #66806a;
            font-size: 0.75rem;
            margin-bottom: 3px;
            font-weight: normal;
        }

        .vps-info-value {
            color: #334155;
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* 状态标签样式优化 */
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            min-width: 80px;
            text-align: center;
            width: 90px;
        }

        .status-normal {
            background: #7edb83;
            color: #475569;
        }

        .status-warning {
            background: #fff8e1;
            color: #ff8f00;
        }

        .status-danger {
            background: #ffebee;
            color: #c62828;
        }

        .management-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 18px;
        }

        .management-hint { color: #526678; font-size: .86rem; }
        .action-group { width: 180px; display: flex; justify-content: flex-end; gap: 6px; }
        .action-btn, .primary-btn, .secondary-btn, .danger-btn {
            border: 0;
            border-radius: 9px;
            padding: 7px 11px;
            font: inherit;
            cursor: pointer;
            transition: transform .15s ease, background .15s ease;
        }
        .action-btn { background: rgba(255,255,255,.65); color: #405466; padding: 6px 9px; font-size: .8rem; }
        .action-btn.renew { background: #336caa; color: white; }
        .action-btn.delete { color: #a93d49; }
        .primary-btn { background: #315f91; color: white; padding: 9px 15px; }
        .secondary-btn { background: #e6edf4; color: #405466; }
        .danger-btn { background: #b44350; color: white; }
        .action-btn:hover, .primary-btn:hover, .secondary-btn:hover, .danger-btn:hover { transform: translateY(-1px); }
        button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
            outline: 3px solid rgba(49,95,145,.28); outline-offset: 2px;
        }

        dialog {
            width: min(620px, calc(100vw - 28px));
            border: 0;
            border-radius: 18px;
            padding: 0;
            color: #334155;
            box-shadow: 0 24px 80px rgba(29,50,72,.28);
        }
        dialog::backdrop { background: rgba(24,42,59,.48); backdrop-filter: blur(3px); }
        .dialog-head { padding: 22px 24px 10px; }
        .dialog-head h2 { margin: 0 0 5px; font-size: 1.25rem; font-weight: 650; }
        .dialog-head p { margin: 0; color: #6b7f90; font-size: .86rem; }
        .dialog-body { padding: 14px 24px 22px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-field.full { grid-column: 1 / -1; }
        .form-field label { display: block; margin-bottom: 5px; font-size: .8rem; color: #526678; }
        .form-field input, .form-field select, .form-field textarea {
            width: 100%; border: 1px solid #cbd8e3; border-radius: 9px; padding: 9px 10px;
            background: #f8fbfd; color: #263849; font: inherit;
        }
        .dialog-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 20px; }
        .renew-preview { margin-top: 16px; padding: 12px 14px; background: #edf5fc; border-radius: 10px; font-size: .88rem; }
        .toast-message { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 2000;
            background: #203a52; color: white; border-radius: 10px; padding: 10px 16px; box-shadow: 0 8px 30px rgba(0,0,0,.22); }


        /* 添加动态效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .vps-row {
            animation: fadeIn 0.3s ease-out forwards;
        }

        /* 为每一行添加交错动画延迟 */
        .vps-row:nth-child(1) { animation-delay: 0.05s; }
        .vps-row:nth-child(2) { animation-delay: 0.1s; }
        .vps-row:nth-child(3) { animation-delay: 0.15s; }
        .vps-row:nth-child(4) { animation-delay: 0.2s; }
        .vps-row:nth-child(5) { animation-delay: 0.25s; }
        .vps-row:nth-child(6) { animation-delay: 0.3s; }

        /* 深色主题按钮样式 */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #e0f2e1;
            color: #475569;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(46, 125, 50, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            z-index: 1000;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
            background: #c8e6c9;
        }

        /* 深色主题样式 */
        body.dark-theme {
            background-color: #132c1a;
            color: #e0f2e1;
        }

        body.dark-theme .stats-container,
        body.dark-theme .vps-list-container {
            background: rgba(24, 55, 24, 0.6);
            border-color: rgba(76, 175, 80, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        body.dark-theme .vps-list-header,
        body.dark-theme .vps-row {
            border-color: rgba(76, 175, 80, 0.15);
        }

        body.dark-theme .vps-row:hover {
            background-color: rgba(76, 175, 80, 0.1);
        }

        body.dark-theme .vps-name a {
            color: #81c784;
        }

        body.dark-theme .vps-info-value {
            color: #e0f2e1;
        }

        body.dark-theme .vps-info-label {
            color: #a5d6a7;
        }

        body.dark-theme .page-title {
            color: #81c784;
        }

        body.dark-theme .stats-item h3 {
            color: #a5d6a7;
        }

        body.dark-theme .stats-item p {
            color: #81c784;
        }

        body.dark-theme .vps-name a:hover {
            color: #a5d6a7;
        }

        body.dark-theme .status-normal {
            background: rgba(76, 175, 80, 0.2);
            color: #a5d6a7;
        }

        body.dark-theme .status-warning {
            background: rgba(255, 193, 7, 0.2);
            color: #ffd54f;
        }

        body.dark-theme .status-danger {
            background: rgba(244, 67, 54, 0.2);
            color: #ef9a9a;
        }

        body.dark-theme .theme-toggle {
            background: #475569;
            color: #e0f2e1;
        }

        body.dark-theme .theme-toggle:hover {
            background: #388e3c;
        }

        body.dark-theme .vps-link {
            background: #475569;
        }

        body.dark-theme .vps-link:hover {
            background: #388e3c;
        }
        body.dark-theme dialog { background: #203729; color: #e0f2e1; }
        body.dark-theme .dialog-head p, body.dark-theme .form-field label { color: #a9c4b0; }
        body.dark-theme .form-field input, body.dark-theme .form-field select, body.dark-theme .form-field textarea {
            background: #172c20; border-color: #3d6148; color: #e0f2e1;
        }
        body.dark-theme .renew-preview { background: #294a34; }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .container {
                padding-top: 30px;
                padding-bottom: 40px;
            }
            
            .vps-list-header {
                display: none;
            }
            
            .vps-row {
                padding: 15px 10px;
                flex-direction: column;
                align-items: stretch;
            }
            
            .vps-name {
                margin-bottom: 10px;
                text-align: center;
                padding-right: 0;
            }
            
            .vps-info {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .vps-info-item {
                flex: 1 0 40%;
                margin-bottom: 10px;
                padding: 0 5px;
            }
            
            .status-badge {
                margin: 10px auto 0;
                width: 100%;
                max-width: 200px;
            }
            
            .vps-action {
                width: 100%;
                text-align: center;
                margin-top: 12px;
            }
            
            .vps-link {
                width: 100%;
                max-width: 200px;
            }
            .management-bar { align-items: stretch; flex-direction: column; }
            .primary-btn { width: 100%; }
            .action-group { width: 100%; justify-content: center; margin-top: 10px; }
            .form-grid { grid-template-columns: 1fr; }
            .form-field.full { grid-column: auto; }
            
            .page-title {
                font-size: 1.5rem;
                margin-bottom: 25px;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">

        </svg>
    </button>
    <div class="container">
        <script src="exchange_rates.js"></script>
        <h1 class="page-title">VPS到期监控</h1>
        <div class="management-bar">
            <div class="management-hint" id="saveMode">正在连接本地数据…</div>
            <button class="primary-btn" type="button" id="addServiceBtn">＋ 新增服务器</button>
        </div>
        <!-- 状态统计面板 -->
        <div class="stats-container">
            <div class="row">
                <div class="col-md-4 stats-item">
                    <h3>服务器总数</h3>
                    <p id="serverCount">--</p>
                </div>
                <div class="col-md-4 stats-item">
                    <h3>月均支出</h3>
                    <p id="totalCost">--</p>
                </div>
                <div class="col-md-4 stats-item">
                    <h3>即将到期</h3>
                    <p id="expiringCount">--</p>
                </div>
            </div>
        </div>

        <!-- VPS列表容器（使用统一大背景） -->
        <div class="vps-list-container">
            <!-- 列表标题头 -->
            <div class="vps-list-header">
                <div class="vps-header-name">服务器名称</div>
                <div class="vps-header-info">
                    <div class="vps-header-item">费用</div>
                    <div class="vps-header-item">月均</div>
                    <div class="vps-header-item">到期时间</div>
                    <div class="vps-header-item">SSL证书</div>
                </div>

                <div class="vps-header-status">剩余天数</div>
                <div class="vps-header-action">管理</div>
            </div>
            
            <!-- VPS行列表 -->
            <div id="vpsRows">
                <div class="text-center" id="loadingMessage">
                    <div class="spinner-border text-success" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <dialog id="serviceDialog">
        <form method="dialog" id="serviceForm">
            <div class="dialog-head"><h2 id="serviceDialogTitle">新增服务器</h2><p>服务器与 SSL 到期时间分别记录，续期时互不影响。</p></div>
            <div class="dialog-body">
                <div class="form-grid">
                    <div class="form-field"><label for="serviceName">名称 *</label><input id="serviceName" required></div>
                    <div class="form-field"><label for="serviceUrl">管理地址</label><input id="serviceUrl" type="url" placeholder="https://"></div>
                    <div class="form-field"><label for="serviceCost">费用</label><input id="serviceCost" type="number" min="0" step="0.01"></div>
                    <div class="form-field"><label for="serviceCurrency">币种</label><select id="serviceCurrency"><option>CNY</option><option>USD</option><option>EUR</option><option>CAD</option></select></div>
                    <div class="form-field"><label for="serviceCycle">计费周期</label><select id="serviceCycle"><option value="month">月付</option><option value="year">年付</option></select></div>
                    <div class="form-field"><label for="serviceExpire">服务器到期时间 *</label><input id="serviceExpire" type="datetime-local" step="1" required></div>
                    <div class="form-field"><label for="serviceSslExpire">SSL 到期时间</label><input id="serviceSslExpire" type="datetime-local" step="1"></div>
                    <div class="form-field full"><label for="serviceNote">备注</label><textarea id="serviceNote" rows="2"></textarea></div>
                </div>
                <div class="dialog-actions"><button class="secondary-btn" value="cancel" type="button" data-close="serviceDialog">取消</button><button class="primary-btn" value="save" type="submit">保存更改</button></div>
            </div>
        </form>
    </dialog>

    <dialog id="renewDialog">
        <form method="dialog" id="renewForm">
            <div class="dialog-head"><h2 id="renewDialogTitle">续期</h2><p>两个周期相互独立；填 0 表示本次不调整。</p></div>
            <div class="dialog-body">
                <div class="form-grid">
                    <div class="form-field"><label for="serverRenewMonths">服务器增加（月）</label><input id="serverRenewMonths" type="number" min="0" max="120" value="1" required></div>
                    <div class="form-field"><label for="sslRenewMonths">SSL 增加（月）</label><input id="sslRenewMonths" type="number" min="0" max="120" value="0" required></div>
                </div>
                <div class="renew-preview" id="renewPreview"></div>
                <div class="dialog-actions"><button class="secondary-btn" type="button" data-close="renewDialog">取消</button><button class="primary-btn" type="submit">确认续期</button></div>
            </div>
        </form>
    </dialog>

        const escapeHtml = (value = '') => String(value).replace(/[&<>'"]/g, char => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        })[char]);

        function toInputDateTime(value) {
            if (!value) return '';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return '';
            const pad = number => String(number).padStart(2, '0');
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
        }

            return value ? `${value.replace('T', 'T')}` : '';
        }

        function addMonths(value, months) {
            if (!value || !months) return value ? new Date(value) : null;
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return null;
            const originalDay = date.getDate();
            date.setDate(1);
            date.setMonth(date.getMonth() + Number(months));
            const lastDay = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
            date.setDate(Math.min(originalDay, lastDay));
            return date;
        }

        function showToast(message) {
            document.querySelector('.toast-message')?.remove();
            const toast = document.createElement('div');
            toast.className = 'toast-message';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2600);
        }

        async function loadServices() {
            try {
                const response = await fetch('/api/services', { cache: 'no-store' });
                if (!response.ok) throw new Error('API unavailable');
                const services = await response.json();
                vpsServices.splice(0, vpsServices.length, ...services);
                apiAvailable = true;
                document.getElementById('saveMode').textContent = '本地管理模式 · 保存后同步提醒数据';
            } catch (_) {
                const saved = localStorage.getItem('vpsServices');
                if (saved) vpsServices.splice(0, vpsServices.length, ...JSON.parse(saved));
                document.getElementById('saveMode').textContent = '预览模式 · 双击 web_manager.bat 后可写回文件';
            }
            updateVPSRows();
        }

        async function persistServices(successMessage) {
            if (apiAvailable) {
                const response = await fetch('/api/services', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(vpsServices)
                });
                if (!response.ok) {
                    const result = await response.json().catch(() => ({}));
                    throw new Error(result.error || '保存失败');
                }
            } else {
                localStorage.setItem('vpsServices', JSON.stringify(vpsServices));
            }
            updateVPSRows();
            showToast(apiAvailable ? successMessage : `${successMessage}（仅保存在当前浏览器）`);
        }
        
        console.log('VPS服务数据:', vpsServices);  // 添加调试输出

        function formatDate(date) {
            return date.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        function formatDateTime(date) {
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        function getNextExpireDate(service) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            // 明确记录的到期时间优先；续费操作会更新这个字段。
            if (service.expireDate) {
                return new Date(service.expireDate);
            }

            if (service.monthlyExpireDay) {
                let expireDate = new Date(today.getFullYear(), today.getMonth(), service.monthlyExpireDay);
                if (today.getDate() > service.monthlyExpireDay) {
                    expireDate = new Date(today.getFullYear(), today.getMonth() + 1, service.monthlyExpireDay);
                }
                if (service.expireTime) {
                    const parts = service.expireTime.split(':').map(Number);
                    expireDate.setHours(parts[0] || 0, parts[1] || 0, parts[2] || 0, 0);
                }
                return expireDate;
            }

            return null;
        }

        function calculateDaysUntilExpire(service) {
            try {
                const today = new Date();
                today.setHours(0, 0, 0, 0);  // 设置时间为当天0点
                const expireDate = getNextExpireDate(service);

                if (!expireDate) {
                    return '未设置到期日';
                }

                expireDate.setHours(0, 0, 0, 0);  // 仅按日期计算剩余天数
                const diffTime = expireDate - today;
                return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            } catch (error) {
                console.error('计算到期日期时出错:', error);
                return '计算错误';
            }
        }

        function convertToCNY(amount, currency) {
            if (exchangeRates[currency] && !isNaN(amount)) {
                return amount * exchangeRates[currency];
            }
            return 0;
        }

        function updateVPSRows() {
            try {
                const container = document.getElementById('vpsRows');
                
                // 计算到期天数并排序
                const sortedServices = [...vpsServices].sort((a, b) => {
                    const daysA = calculateDaysUntilExpire(a);
                    const daysB = calculateDaysUntilExpire(b);
                    return (typeof daysA === 'number' && typeof daysB === 'number') ? daysA - daysB : 0;
                });

                let totalCostCNY = 0;
                let expiringCount = 0;

                const rowsHTML = sortedServices.map(service => {
                    const serviceIndex = vpsServices.indexOf(service);
                    const daysLeft = calculateDaysUntilExpire(service);
                    const costInCNY = convertToCNY(parseFloat(service.cost), service.currency);
                    const monthlyCost = service.billingCycle === 'year' ? costInCNY / 12 : costInCNY;
                    totalCostCNY += monthlyCost;

                    if (typeof daysLeft === 'number' && daysLeft <= 3) {
                        expiringCount++;
                    }

                    let statusClass = 'status-normal';
                    if (typeof daysLeft === 'number') {
                        if (daysLeft <= 3) statusClass = 'status-danger';
                        else if (daysLeft <= 7) statusClass = 'status-warning';
                    }

                    const nextExpireDate = getNextExpireDate(service);
                    const expireDateText = nextExpireDate ? ((service.billingCycle === 'year' && service.expireDate && !String(service.expireDate).includes('T')) || (service.billingCycle !== 'year' && !service.expireTime) ? formatDate(nextExpireDate) : formatDateTime(nextExpireDate)) : '未设置';
                    const sslDate = service.sslExpireDate ? new Date(service.sslExpireDate) : null;
                    const sslText = service.sslExpireDate ? (String(service.sslExpireDate).includes('T') ? formatDateTime(sslDate) : formatDate(sslDate)) : '';
                    const cycleLabel = service.billingCycle === 'year' ? '年' : '月';
                    const costText = `${service.cost} ${service.currency}/${cycleLabel}`;

                    return `
                        <div class="vps-row">
                            <div class="vps-name">
                                <a href="${escapeHtml(service.url || '#')}" target="_blank">${escapeHtml(service.name)}</a>
                                ${service.note ? `<div class="vps-note">${escapeHtml(service.note)}</div>` : ''}
                            </div>
                            <div class="vps-info">
                                <div class="vps-info-item">
                                    <div class="vps-info-label">费用</div>
                                    <div class="vps-info-value">${costText}</div>
                                </div>
                                <div class="vps-info-item">
                                    <div class="vps-info-label">月均</div>
                                    <div class="vps-info-value">${monthlyCost ? '¥' + monthlyCost.toFixed(2) : '¥0.00'}</div>
                                </div>
                                <div class="vps-info-item">
                                    <div class="vps-info-label">到期时间</div>
                                    <div class="vps-info-value">${expireDateText}</div>
                                </div>
                                <div class="vps-info-item">
                                    <div class="vps-info-label">SSL证书</div>
                                    <div class="vps-info-value">${sslText || '-'}</div>
                                </div>
                            </div>
                            <div class="status-badge ${statusClass}">
                                ${typeof daysLeft === 'number' ? `${daysLeft} 天` : daysLeft}
                            </div>
                            <div class="action-group">
                                <button class="action-btn renew" type="button" data-action="renew" data-index="${serviceIndex}">续期</button>
                                <button class="action-btn" type="button" data-action="edit" data-index="${serviceIndex}">编辑</button>
                                <button class="action-btn delete" type="button" data-action="delete" data-index="${serviceIndex}">删除</button>
                            </div>
                        </div>
                    `;
                }).join('');

                container.innerHTML = rowsHTML;
                document.getElementById('totalCost').textContent = totalCostCNY ? `¥${totalCostCNY.toFixed(2)}` : '¥0.00';
                document.getElementById('serverCount').textContent = vpsServices.length;
                document.getElementById('expiringCount').textContent = expiringCount;
            } catch (error) {
                console.error('更新VPS行时出错:', error);
            }
        }

        function openServiceDialog(index = null) {
            editingIndex = index;
            const service = index === null ? {} : vpsServices[index];
            document.getElementById('serviceDialogTitle').textContent = index === null ? '新增服务器' : `编辑 · ${service.name}`;
            document.getElementById('serviceName').value = service.name || '';
            document.getElementById('serviceUrl').value = service.url || '';
            document.getElementById('serviceCost').value = service.cost ?? '';
            document.getElementById('serviceCurrency').value = service.currency || 'CNY';
            document.getElementById('serviceCycle').value = service.billingCycle || 'month';
            document.getElementById('serviceExpire').value = toInputDateTime(service.expireDate);
            document.getElementById('serviceSslExpire').value = toInputDateTime(service.sslExpireDate);
            document.getElementById('serviceNote').value = service.note || '';
            document.getElementById('serviceDialog').showModal();
        }

        function openRenewDialog(index) {
            renewingIndex = index;
            const service = vpsServices[index];
            document.getElementById('renewDialogTitle').textContent = `续期 · ${service.name}`;
            document.getElementById('serverRenewMonths').value = service.billingCycle === 'year' ? 12 : 1;
            document.getElementById('sslRenewMonths').value = 0;
            updateRenewPreview();
            document.getElementById('renewDialog').showModal();
        }

        function updateRenewPreview() {
            if (renewingIndex === null) return;
            const service = vpsServices[renewingIndex];
            const serverMonths = Number(document.getElementById('serverRenewMonths').value || 0);
            const sslMonths = Number(document.getElementById('sslRenewMonths').value || 0);
            const serverDate = addMonths(service.expireDate, serverMonths);
            const sslDate = addMonths(service.sslExpireDate, sslMonths);
            const parts = [];
            parts.push(serverMonths ? `服务器 → ${serverDate ? formatDateTime(serverDate) : '请先设置到期时间'}` : '服务器到期时间不变');
            parts.push(sslMonths ? `SSL → ${sslDate ? formatDateTime(sslDate) : '请先设置 SSL 到期时间'}` : 'SSL 到期时间不变');
            document.getElementById('renewPreview').innerHTML = parts.map(escapeHtml).join('<br>');
        }

        document.getElementById('addServiceBtn').addEventListener('click', () => openServiceDialog());
        document.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click', () => {
            document.getElementById(button.dataset.close).close();
        }));
        document.getElementById('serverRenewMonths').addEventListener('input', updateRenewPreview);
        document.getElementById('sslRenewMonths').addEventListener('input', updateRenewPreview);

        document.getElementById('vpsRows').addEventListener('click', async event => {
            const button = event.target.closest('[data-action]');
            if (!button) return;
            const index = Number(button.dataset.index);
            if (button.dataset.action === 'edit') openServiceDialog(index);
            if (button.dataset.action === 'renew') openRenewDialog(index);
            if (button.dataset.action === 'delete' && confirm(`确定删除“${vpsServices[index].name}”吗？此操作无法撤销。`)) {
                vpsServices.splice(index, 1);
                try { await persistServices('服务器已删除'); } catch (error) { alert(error.message); }
            }
        });

        document.getElementById('serviceForm').addEventListener('submit', async event => {
            event.preventDefault();
            const expireDate = toStoredDateTime(document.getElementById('serviceExpire').value);
            const sslExpireDate = toStoredDateTime(document.getElementById('serviceSslExpire').value);
            const existing = editingIndex === null ? {} : vpsServices[editingIndex];
            const service = {
                ...existing,
                name: document.getElementById('serviceName').value.trim(),
                cost: Number(document.getElementById('serviceCost').value || 0),
                currency: document.getElementById('serviceCurrency').value,
                billingCycle: document.getElementById('serviceCycle').value,
                expireDate,
                url: document.getElementById('serviceUrl').value.trim()
            };
            const note = document.getElementById('serviceNote').value.trim();
            note ? service.note = note : delete service.note;
            sslExpireDate ? service.sslExpireDate = sslExpireDate : delete service.sslExpireDate;
            if (service.billingCycle === 'month') {
                const date = new Date(expireDate);
                service.monthlyExpireDay = date.getDate();
                service.expireTime = date.toTimeString().slice(0, 8);
            } else {
                delete service.monthlyExpireDay;
                delete service.expireTime;
            }
            if (editingIndex === null) vpsServices.push(service); else vpsServices[editingIndex] = service;
            try {
                await persistServices(editingIndex === null ? '服务器已新增' : '服务器信息已更新');
                document.getElementById('serviceDialog').close();
            } catch (error) { alert(error.message); }
        });

        document.getElementById('renewForm').addEventListener('submit', async event => {
            event.preventDefault();
            const service = vpsServices[renewingIndex];
            const serverMonths = Number(document.getElementById('serverRenewMonths').value || 0);
            const sslMonths = Number(document.getElementById('sslRenewMonths').value || 0);
            if (!serverMonths && !sslMonths) return alert('至少填写一个续期月数。');
            if (serverMonths) {
                const date = addMonths(service.expireDate, serverMonths);
                if (!date) return alert('请先编辑并设置服务器到期时间。');
                service.expireDate = toInputDateTime(date);
                if (service.billingCycle === 'month') {
                    service.monthlyExpireDay = date.getDate();
                    service.expireTime = date.toTimeString().slice(0, 8);
                }
            }
            if (sslMonths) {
                const date = addMonths(service.sslExpireDate, sslMonths);
                if (!date) return alert('请先编辑并设置 SSL 到期时间。');
                service.sslExpireDate = toInputDateTime(date);
            }
            try {
                await persistServices('续期已保存');
                document.getElementById('renewDialog').close();
            } catch (error) { alert(error.message); }
        });

        // 初始更新
        document.addEventListener('DOMContentLoaded', () => {
            // 模拟exchange_rates.js（如果脚本未加载）
            if (typeof exchangeRates === 'undefined') {
                window.exchangeRates = {
                    'USD': 7.1,
                    'EUR': 7.7,
                    'CNY': 1
                };
            }
            loadServices();
        });
        
        // 每天更新一次
        setInterval(updateVPSRows, 24 * 60 * 60 * 1000);

        // 主题切换功能
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        
        // 检查本地存储中的主题设置
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            body.classList.add('dark-theme');
        }

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-theme');
            // 保存主题设置到本地存储
            localStorage.setItem('theme', body.classList.contains('dark-theme') ? 'dark' : 'light');
        });
    </script>
</body>
</html>
