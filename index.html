<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPS到期监控</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 使用霞鹜文楷屏幕阅读体 -->
    <link rel="stylesheet" href="https://npm.elemecdn.com/lxgw-wenkai-screen-webfont@1.7.0/lxgwwenkaiscreen.css">
    <style>
        body {
            background-color: #b1cbf1;
            font-family: "LXGW WenKai Screen", sans-serif;
            color: #334155;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            padding-top: 40px;
            padding-bottom: 60px;
        }

        /* 页面标题样式 */
        .page-title {
            color: #475569; /* 使用绿色作为主色调 */
            text-align: center;
            margin-bottom: 35px;
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        /* 统计面板样式优化 */
        .stats-container {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 35px;
            box-shadow: 0 4px 20px rgba(46, 125, 50, 0.08);
            border-top: 4px solid #b1cbf1;
        }

        .stats-item {
            text-align: center;
            padding: 15px 10px;
            position: relative;
        }

        .stats-item:not(:last-child):after {
            content: '';
            position: absolute;
            right: 0;
            top: 25%;
            height: 50%;
            width: 1px;
            background-color: rgba(76, 175, 80, 0.2);
        }

        .stats-item h3 {
            color: #66806a;
            font-size: 0.95rem;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .stats-item p {
            color: #475569;
            font-size: 1.7rem;
            font-weight: 600;
            margin: 0;
        }

        /* 整个VPS列表的容器 */
        .vps-list-container {
            background: rgba(215, 235, 240, 0.8);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(46, 125, 50, 0.08);
            border-top: 4px solid #b1cbf1;
        }

        /* 列表头部 */
        .vps-list-header {
            display: flex;
            border-bottom: 1px solid #e0f2e1;
            padding-bottom: 15px;
            margin-bottom: 15px;
            color: #66806a;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .vps-header-name {
            flex: 1.5;
            padding-left: 10px;
        }

        .vps-header-info {
            flex: 4;
            display: flex;
        }

        .vps-header-item {
            flex: 1;
            text-align: center;
            padding: 0 12px;
        }

        .vps-header-action {
            width: 100px;
            text-align: center;
        }

        .vps-header-status {
            width: 90px;
            text-align: center;
        }

        /* VPS行样式 - 去除边框和分隔感 */
        .vps-row {
            display: flex;
            align-items: center;
            padding: 15px 10px;
            border-bottom: 1px solid rgba(224, 242, 225, 0.5);
            transition: all 0.2s ease;
        }

        .vps-row:hover {
            background-color: rgba(224, 242, 225, 0.3);
        }

        .vps-row:last-child {
            border-bottom: none;
        }

        .vps-name {
            flex: 1.5;
            padding-right: 12px;
        }

        .vps-name a {
            color: #2f343c;
            font-weight: 500;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .vps-name a:hover {
            color: #4caf50;
        }

        .vps-note {
            font-size: 0.75rem;
            color: #66806a;
            margin-top: 4px;
            line-height: 1.4;
            word-break: break-all;
        }

        .vps-info {
            flex: 4;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .vps-info-item {
            padding: 0 12px;
            flex: 1;
            text-align: center;
        }

        .vps-info-label {
            color: #66806a;
            font-size: 0.75rem;
            margin-bottom: 3px;
            font-weight: normal;
        }

        .vps-info-value {
            color: #334155;
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* 状态标签样式优化 */
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            min-width: 80px;
            text-align: center;
            width: 90px;
        }

        .status-normal {
            background: #7edb83;
            color: #475569;
        }

        .status-warning {
            background: #fff8e1;
            color: #ff8f00;
        }

        .status-danger {
            background: #ffebee;
            color: #c62828;
        }


        /* 添加动态效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .vps-row {
            animation: fadeIn 0.3s ease-out forwards;
        }

        /* 为每一行添加交错动画延迟 */
        .vps-row:nth-child(1) { animation-delay: 0.05s; }
        .vps-row:nth-child(2) { animation-delay: 0.1s; }
        .vps-row:nth-child(3) { animation-delay: 0.15s; }
        .vps-row:nth-child(4) { animation-delay: 0.2s; }
        .vps-row:nth-child(5) { animation-delay: 0.25s; }
        .vps-row:nth-child(6) { animation-delay: 0.3s; }

        /* 深色主题按钮样式 */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #e0f2e1;
            color: #475569;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(46, 125, 50, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            z-index: 1000;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
            background: #c8e6c9;
        }

        /* 深色主题样式 */
        body.dark-theme {
            background-color: #132c1a;
            color: #e0f2e1;
        }

        body.dark-theme .stats-container,
        body.dark-theme .vps-list-container {
            background: rgba(24, 55, 24, 0.6);
            border-color: rgba(76, 175, 80, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        body.dark-theme .vps-list-header,
        body.dark-theme .vps-row {
            border-color: rgba(76, 175, 80, 0.15);
        }

        body.dark-theme .vps-row:hover {
            background-color: rgba(76, 175, 80, 0.1);
        }

        body.dark-theme .vps-name a {
            color: #81c784;
        }

        body.dark-theme .vps-info-value {
            color: #e0f2e1;
        }

        body.dark-theme .vps-info-label {
            color: #a5d6a7;
        }

        body.dark-theme .page-title {
            color: #81c784;
        }

        body.dark-theme .stats-item h3 {
            color: #a5d6a7;
        }

        body.dark-theme .stats-item p {
            color: #81c784;
        }

        body.dark-theme .vps-name a:hover {
            color: #a5d6a7;
        }

        body.dark-theme .status-normal {
            background: rgba(76, 175, 80, 0.2);
            color: #a5d6a7;
        }

        body.dark-theme .status-warning {
            background: rgba(255, 193, 7, 0.2);
            color: #ffd54f;
        }

        body.dark-theme .status-danger {
            background: rgba(244, 67, 54, 0.2);
            color: #ef9a9a;
        }

        body.dark-theme .theme-toggle {
            background: #475569;
            color: #e0f2e1;
        }

        body.dark-theme .theme-toggle:hover {
            background: #388e3c;
        }

        body.dark-theme .vps-link {
            background: #475569;
        }

        body.dark-theme .vps-link:hover {
            background: #388e3c;
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .container {
                padding-top: 30px;
                padding-bottom: 40px;
            }
            
            .vps-list-header {
                display: none;
            }
            
            .vps-row {
                padding: 15px 10px;
                flex-direction: column;
                align-items: stretch;
            }
            
            .vps-name {
                margin-bottom: 10px;
                text-align: center;
                padding-right: 0;
            }
            
            .vps-info {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .vps-info-item {
                flex: 1 0 40%;
                margin-bottom: 10px;
                padding: 0 5px;
            }
            
            .status-badge {
                margin: 10px auto 0;
                width: 100%;
                max-width: 200px;
            }
            
            .vps-action {
                width: 100%;
                text-align: center;
                margin-top: 12px;
            }
            
            .vps-link {
                width: 100%;
                max-width: 200px;
            }
            
            .page-title {
                font-size: 1.5rem;
                margin-bottom: 25px;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
            <path d="M6 .278a.768.768 0 0 1 .08.858 7.208 7.208 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277.527 0 1.04-.055 1.533-.16a.787.787 0 0 1 .81.316.733.733 0 0 1-.031.893A8.349 8.349 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.752.752 0 0 1 6 .278z"/>
        </svg>
    </button>
    <div class="container">
        <script src="exchange_rates.js"></script>
        <h1 class="page-title">VPS到期监控</h1>
        <!-- 状态统计面板 -->
        <div class="stats-container">
            <div class="row">
                <div class="col-md-4 stats-item">
                    <h3>服务器总数</h3>
                    <p id="serverCount">--</p>
                </div>
                <div class="col-md-4 stats-item">
                    <h3>月均支出</h3>
                    <p id="totalCost">--</p>
                </div>
                <div class="col-md-4 stats-item">
                    <h3>即将到期</h3>
                    <p id="expiringCount">--</p>
                </div>
            </div>
        </div>

        <!-- VPS列表容器（使用统一大背景） -->
        <div class="vps-list-container">
            <!-- 列表标题头 -->
            <div class="vps-list-header">
                <div class="vps-header-name">服务器名称</div>
                <div class="vps-header-info">
                    <div class="vps-header-item">费用</div>
                    <div class="vps-header-item">月均</div>
                    <div class="vps-header-item">到期时间</div>
                    <div class="vps-header-item">SSL证书</div>
                </div>

                <div class="vps-header-status">剩余天数</div>
            </div>
            
            <!-- VPS行列表 -->
            <div id="vpsRows">
                <div class="text-center" id="loadingMessage">
                    <div class="spinner-border text-success" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 调试信息
        console.log('脚本开始执行');
        
        const vpsServices = [
    {
        "name": "特彼",
        "cost": 299.2,
        "currency": "CNY",
        "billingCycle": "month",
        "monthlyExpireDay": 22,
        "expireTime": "23:59:59",
        "url": ""
    },
    {
        "name": "兆宁",
        "cost": 48.0,
        "currency": "CNY",
        "billingCycle": "month",
        "monthlyExpireDay": 4,
        "expireTime": "23:59:59",
        "url": ""
    },
    {
        "name": "半影",
        "cost": 99.0,
        "currency": "CNY",
        "billingCycle": "year",
        "expireDate": "2026-12-28T23:59:59",
        "sslExpireDate": "2026-10-01T07:59:59",
        "note": "SSL证书到期时间：2026-10-1 07:59:59",
        "url": ""
    },
    {
        "name": "海思",
        "cost": 99.0,
        "currency": "CNY",
        "billingCycle": "year",
        "expireDate": "2026-11-20T23:59:59",
        "url": ""
    },
    {
        "name": "半影 发货",
        "cost": 259.0,
        "currency": "CNY",
        "billingCycle": "month",
        "monthlyExpireDay": 17,
        "sslExpireDate": "2026-09-05",
        "note": "SSL证书到期时间：2026-09-05",
        "url": ""
    },
    {
        "name": "博杨 SBS",
        "cost": 359.0,
        "currency": "CNY",
        "billingCycle": "month",
        "monthlyExpireDay": 18,
        "note": "续费时执行SSL续期命令（sudo certbot renew --dry-run）并重载Nginx",
        "url": ""
    },
    {
        "name": "轮询前端 防攻击",
        "cost": 899.0,
        "currency": "CNY",
        "billingCycle": "month",
        "monthlyExpireDay": 21,
        "url": ""
    },
    {
        "name": "灏星",
        "cost": 45.0,
        "currency": "CNY",
        "billingCycle": "month",
        "monthlyExpireDay": 8,
        "expireTime": "00:00:00",
        "note": "续费时执行SSL续期命令（sudo certbot renew --dry-run）并重载Nginx",
        "url": ""
    },
    {
        "name": "谷鑫",
        "cost": 99.0,
        "currency": "CNY",
        "billingCycle": "year",
        "expireDate": "2027-01-21T23:59:59",
        "url": ""
    },
    {
        "name": "灏影",
        "cost": 99.0,
        "currency": "CNY",
        "billingCycle": "year",
        "expireDate": "2027-05-15T23:59:59",
        "url": ""
    },
    {
        "name": "特彼",
        "cost": 99.0,
        "currency": "CNY",
        "billingCycle": "year",
        "expireDate": "2026-12-29T23:59:59",
        "note": "年付",
        "url": ""
    },
    {
        "name": "汇海",
        "cost": 99.0,
        "currency": "CNY",
        "billingCycle": "year",
        "expireDate": "2026-10-24T23:59:59",
        "url": ""
    },
    {
        "name": "睿思凯奇",
        "cost": 99.0,
        "currency": "CNY",
        "billingCycle": "year",
        "expireDate": "2026-10-24T23:59:59",
        "url": ""
    }
];
        
        console.log('VPS服务数据:', vpsServices);  // 添加调试输出

        function formatDate(date) {
            return date.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        function formatDateTime(date) {
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        function getNextExpireDate(service) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            if (service.billingCycle === 'year' && service.expireDate) {
                return new Date(service.expireDate);
            }

            if (service.monthlyExpireDay) {
                let expireDate = new Date(today.getFullYear(), today.getMonth(), service.monthlyExpireDay);
                if (today.getDate() > service.monthlyExpireDay) {
                    expireDate = new Date(today.getFullYear(), today.getMonth() + 1, service.monthlyExpireDay);
                }
                if (service.expireTime) {
                    const parts = service.expireTime.split(':').map(Number);
                    expireDate.setHours(parts[0] || 0, parts[1] || 0, parts[2] || 0, 0);
                }
                return expireDate;
            }

            if (service.expireDate) {
                return new Date(service.expireDate);
            }

            return null;
        }

        function calculateDaysUntilExpire(service) {
            try {
                const today = new Date();
                today.setHours(0, 0, 0, 0);  // 设置时间为当天0点
                const expireDate = getNextExpireDate(service);

                if (!expireDate) {
                    return '未设置到期日';
                }

                expireDate.setHours(0, 0, 0, 0);  // 仅按日期计算剩余天数
                const diffTime = expireDate - today;
                return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            } catch (error) {
                console.error('计算到期日期时出错:', error);
                return '计算错误';
            }
        }

        function convertToCNY(amount, currency) {
            if (exchangeRates[currency] && !isNaN(amount)) {
                return amount * exchangeRates[currency];
            }
            return 0;
        }

        function updateVPSRows() {
            try {
                const container = document.getElementById('vpsRows');
                
                // 计算到期天数并排序
                const sortedServices = [...vpsServices].sort((a, b) => {
                    const daysA = calculateDaysUntilExpire(a);
                    const daysB = calculateDaysUntilExpire(b);
                    return (typeof daysA === 'number' && typeof daysB === 'number') ? daysA - daysB : 0;
                });

                let totalCostCNY = 0;
                let expiringCount = 0;

                const rowsHTML = sortedServices.map(service => {
                    const daysLeft = calculateDaysUntilExpire(service);
                    const costInCNY = convertToCNY(parseFloat(service.cost), service.currency);
                    const monthlyCost = service.billingCycle === 'year' ? costInCNY / 12 : costInCNY;
                    totalCostCNY += monthlyCost;

                    if (typeof daysLeft === 'number' && daysLeft <= 3) {
                        expiringCount++;
                    }

                    let statusClass = 'status-normal';
                    if (typeof daysLeft === 'number') {
                        if (daysLeft <= 3) statusClass = 'status-danger';
                        else if (daysLeft <= 7) statusClass = 'status-warning';
                    }

                    const nextExpireDate = getNextExpireDate(service);
                    const expireDateText = nextExpireDate ? ((service.billingCycle === 'year' && service.expireDate && !String(service.expireDate).includes('T')) || (service.billingCycle !== 'year' && !service.expireTime) ? formatDate(nextExpireDate) : formatDateTime(nextExpireDate)) : '未设置';
                    const sslDate = service.sslExpireDate ? new Date(service.sslExpireDate) : null;
                    const sslText = service.sslExpireDate ? (String(service.sslExpireDate).includes('T') ? formatDateTime(sslDate) : formatDate(sslDate)) : '';
                    const cycleLabel = service.billingCycle === 'year' ? '年' : '月';
                    const costText = `${service.cost} ${service.currency}/${cycleLabel}`;

                    return `
                        <div class="vps-row">
                            <div class="vps-name">
                                <a href="${service.url || '#'}" target="_blank">${service.name}</a>
                                ${service.note ? `<div class="vps-note">${service.note}</div>` : ''}
                            </div>
                            <div class="vps-info">
                                <div class="vps-info-item">
                                    <div class="vps-info-label">费用</div>
                                    <div class="vps-info-value">${costText}</div>
                                </div>
                                <div class="vps-info-item">
                                    <div class="vps-info-label">月均</div>
                                    <div class="vps-info-value">${monthlyCost ? '¥' + monthlyCost.toFixed(2) : '¥0.00'}</div>
                                </div>
                                <div class="vps-info-item">
                                    <div class="vps-info-label">到期时间</div>
                                    <div class="vps-info-value">${expireDateText}</div>
                                </div>
                                <div class="vps-info-item">
                                    <div class="vps-info-label">SSL证书</div>
                                    <div class="vps-info-value">${sslText || '-'}</div>
                                </div>
                            </div>
                            <div class="status-badge ${statusClass}">
                                ${typeof daysLeft === 'number' ? `${daysLeft} 天` : daysLeft}
                            </div>
                        </div>
                    `;
                }).join('');

                container.innerHTML = rowsHTML;
                document.getElementById('totalCost').textContent = totalCostCNY ? `¥${totalCostCNY.toFixed(2)}` : '¥0.00';
                document.getElementById('serverCount').textContent = vpsServices.length;
                document.getElementById('expiringCount').textContent = expiringCount;
            } catch (error) {
                console.error('更新VPS行时出错:', error);
            }
        }

        // 初始更新
        document.addEventListener('DOMContentLoaded', () => {
            // 模拟exchange_rates.js（如果脚本未加载）
            if (typeof exchangeRates === 'undefined') {
                window.exchangeRates = {
                    'USD': 7.1,
                    'EUR': 7.7,
                    'CNY': 1
                };
            }
            updateVPSRows();
        });
        
        // 每天更新一次
        setInterval(updateVPSRows, 24 * 60 * 60 * 1000);

        // 主题切换功能
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        
        // 检查本地存储中的主题设置
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            body.classList.add('dark-theme');
        }

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-theme');
            // 保存主题设置到本地存储
            localStorage.setItem('theme', body.classList.contains('dark-theme') ? 'dark' : 'light');
        });
    </script>
</body>
</html>
